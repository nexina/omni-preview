app-id: nexina.omni.preview
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm19
command: omni_preview
# Sandbox permissions — review and adjust for your app.
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=x11
  - --share=network
  - --filesystem=host
modules:
  - name: preview
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm19/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm19/lib
      env:
        PUB_CACHE: /run/build/preview/.pub-cache
    # Build steps — review and customise for your project.
    build-commands:
      - flutter pub get --offline
      - flutter build linux --release --no-pub
      - mkdir -p /app/preview
      - cp -r "$BUNDLE_PATH"/. /app/preview/
      - install -Dm755 flatpak/preview-wrapper.sh /app/bin/omni_preview
      - install -Dm644 linux/nexina.omni.preview.metainfo.xml /app/share/metainfo/nexina.omni.preview.metainfo.xml
      - install -Dm644 linux/nexina.omni.preview.desktop /app/share/applications/nexina.omni.preview.desktop
      - install -Dm644 linux/nexina.omni.preview.png /app/share/icons/hicolor/256x256/apps/nexina.omni.preview.png
    sources:
      # Local source directory (used while repository is private)
      - type: dir
        path: ..
